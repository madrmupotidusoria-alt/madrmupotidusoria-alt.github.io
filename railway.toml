[build]
builder = "NIXPACKS"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[[services]]
name = "web"

[services.variables]
NODE_ENV = "production"
PORT = "3001"

[[services.ports]]
port = 3001
handlers = ["http"]

[services.concurrency]
type = "connections"
hard = 25
soft = 20

[[services.resources]]
memory = "256Mi"
cpu = "250m"

[[services]]
name = "frontend"

[services.variables]
VITE_API_URL = "${{services.web.publicDomain}}/api"
